<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- This file was partially generated using Claude Code using the chat session at:
       Link to chat session (issue #9): https://claude.ai/code/cshk_01CSAPnzsPKVdxh1B9DwcKyTH5somisBTRS2fF3ChsBWUS -->
  <title>Pi 5 LoRaWAN gateway: hardware and connectivity</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.5; rx: 8; }
      .hw { fill: #eef4fb; }
      .sw { fill: #f3f7ee; stroke: #5a7a3a; }
      .cloud { fill: #fbf3e8; stroke: #a0672a; }
      .group { fill: none; stroke: #2b5d8c; stroke-width: 1.5; stroke-dasharray: 8 5; }
      .t { font-size: 14px; fill: #111; text-anchor: middle; font-weight: 600; }
      .s { font-size: 12px; fill: #444; text-anchor: middle; }
      .l { font-size: 11.5px; fill: #333; }
      .gl { font-size: 13px; fill: #2b5d8c; font-weight: 600; }
      .line { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .rf { stroke: #8a3ab9; stroke-width: 1.8; fill: none; stroke-dasharray: 2 4; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#111">Raspberry Pi 5 LoRaWAN gateway: hardware and connectivity</text>

  <!-- Sensor node -->
  <rect class="box hw" x="30" y="250" width="170" height="80"/>
  <text class="t" x="115" y="280">LoRaWAN soil-sensor</text>
  <text class="t" x="115" y="298">node</text>
  <text class="s" x="115" y="318">US915, sub-band 2</text>

  <!-- Antenna -->
  <rect class="box hw" x="260" y="120" width="170" height="60"/>
  <text class="t" x="345" y="145">915 MHz antenna</text>
  <text class="s" x="345" y="165">u.FL pigtail</text>

  <!-- Gateway group -->
  <rect class="group" x="240" y="200" width="525" height="350" rx="12"/>
  <text class="gl" x="252" y="542">Gateway</text>

  <!-- WM1302 -->
  <rect class="box hw" x="260" y="232" width="170" height="138"/>
  <text class="t" x="345" y="256">Seeed WM1302</text>
  <text class="t" x="345" y="274">on Pi HAT</text>
  <text class="s" x="345" y="298">SX1302 baseband</text>
  <text class="s" x="345" y="316">SX1250 radio</text>
  <text class="s" x="345" y="334">temperature sensor</text>
  <text class="s" x="345" y="356">40-pin header</text>

  <!-- Pi 5 -->
  <rect class="box hw" x="540" y="232" width="210" height="300"/>
  <text class="t" x="645" y="256">Raspberry Pi 5 (BCM2712)</text>
  <text class="s" x="645" y="274">Buildroot 2026.02.3 image</text>
  <rect class="box sw" x="560" y="288" width="170" height="36"/>
  <text class="s" x="645" y="311">sx1302_hal (libloragw)</text>
  <rect class="box sw" x="560" y="336" width="170" height="36"/>
  <text class="s" x="645" y="359">LoRa Basics Station 2.0.6</text>
  <rect class="box sw" x="560" y="384" width="170" height="36"/>
  <text class="s" x="645" y="400">gwmon 2.1: supervisor,</text>
  <text class="s" x="645" y="414">TCP 9000, health report</text>
  <rect class="box sw" x="560" y="432" width="170" height="36"/>
  <text class="s" x="645" y="455">/dev/watchdog (fed by gwmon)</text>
  <rect class="box sw" x="560" y="480" width="170" height="36"/>
  <text class="s" x="645" y="496">AWS IoT Device Client</text>
  <text class="s" x="645" y="510">(secure tunneling only)</text>
  <line class="line" x1="645" y1="324" x2="645" y2="335"/>
  <line class="line" x1="645" y1="384" x2="645" y2="373"/>
  <line class="line" x1="645" y1="420" x2="645" y2="431"/>

  <!-- WM1302 <-> Pi links -->
  <line class="line" x1="430" y1="296" x2="559" y2="300"/>
  <text class="l" x="440" y="290">SPI0 (spidev)</text>
  <line class="line" x1="430" y1="326" x2="559" y2="310"/>
  <text class="l" x="440" y="338">I2C1 (temperature)</text>
  <line class="line" x1="540" y1="362" x2="431" y2="362"/>
  <text class="l" x="436" y="384">GPIO17/5 reset</text>
  <text class="l" x="436" y="398">(libgpiod)</text>

  <!-- RF and antenna -->
  <path class="rf" d="M200,270 C230,240 240,190 259,165"/>
  <text class="l" x="160" y="200" fill="#8a3ab9">LoRa RF uplinks</text>
  <line class="line" x1="345" y1="180" x2="345" y2="231"/>
  <text class="l" x="352" y="194">u.FL</text>

  <!-- Provisioning function (issue #10) -->
  <rect class="box cloud" x="790" y="70" width="210" height="80"/>
  <text class="t" x="895" y="94">Provisioning function</text>
  <text class="s" x="895" y="113">AWS Lambda, HTTPS address</text>
  <text class="s" x="895" y="131">allow-list: DynamoDB table</text>

  <!-- Network -->
  <rect class="box" x="810" y="296" width="150" height="66"/>
  <text class="t" x="885" y="322">Ethernet / Wi-Fi</text>
  <text class="s" x="885" y="342">to the Internet</text>

  <!-- Gateway programs to the network -->
  <line class="line" x1="730" y1="354" x2="809" y2="318"/>
  <line class="line" x1="730" y1="402" x2="809" y2="334"/>
  <line class="line" x1="730" y1="498" x2="809" y2="350"/>
  <text class="l" x="772" y="425">health report:</text>
  <text class="l" x="772" y="439">MQTT over TLS</text>
  <text class="l" x="772" y="512">tunnel: WebSocket</text>
  <text class="l" x="772" y="526">over TLS</text>

  <!-- Network to the provisioning function -->
  <line class="line" x1="875" y1="296" x2="875" y2="151"/>
  <text class="l" x="867" y="180" text-anchor="end">first boot only:</text>
  <text class="l" x="867" y="194" text-anchor="end">HTTPS POST, EUI</text>
  <text class="l" x="867" y="208" text-anchor="end">and per-card secret</text>

  <!-- AWS IoT Core for LoRaWAN -->
  <rect class="box cloud" x="1000" y="190" width="175" height="78"/>
  <text class="t" x="1087" y="216">AWS IoT Core</text>
  <text class="t" x="1087" y="234">for LoRaWAN</text>
  <text class="s" x="1087" y="254">CUPS and network server</text>
  <path class="line" d="M960,312 L980,312 L980,240 L999,240"/>
  <text class="l" x="884" y="268" font-size="10.5">Station: CUPS, LNS</text>
  <text class="l" x="884" y="281" font-size="10.5">over TLS</text>
  <path class="line" d="M1000,140 L1087,140 L1087,189"/>
  <text class="l" x="1010" y="118">registers the gateway,</text>
  <text class="l" x="1010" y="132">creates its certificate</text>

  <!-- AWS IoT Core: MQTT broker and secure tunneling -->
  <rect class="box cloud" x="1000" y="330" width="175" height="78"/>
  <text class="t" x="1087" y="356">AWS IoT Core</text>
  <text class="s" x="1087" y="376">MQTT broker,</text>
  <text class="s" x="1087" y="394">secure tunneling</text>
  <line class="line" x1="960" y1="345" x2="999" y2="358"/>
  <line class="line" x1="1087" y1="268" x2="1087" y2="329"/>
  <text class="l" x="1095" y="296">uplinks, via a</text>
  <text class="l" x="1095" y="310">destination rule</text>

  <!-- MQTT test client -->
  <rect class="box cloud" x="1000" y="460" width="175" height="62"/>
  <text class="t" x="1087" y="486">MQTT test client</text>
  <text class="s" x="1087" y="506">uplinks and health reports</text>
  <line class="line" x1="1087" y1="408" x2="1087" y2="459"/>

  <!-- Bottom: power, storage, laptop -->
  <rect class="box" x="260" y="600" width="170" height="54"/>
  <text class="t" x="345" y="623">27 W USB-C PD</text>
  <text class="s" x="345" y="642">power supply</text>
  <path class="line" d="M430,627 L600,627 L600,533"/>

  <rect class="box" x="30" y="600" width="170" height="54"/>
  <text class="t" x="115" y="623">microSD</text>
  <text class="s" x="115" y="642">sdcard.img + per-card secret</text>
  <path class="line" d="M200,612 L240,612 L240,570 L560,570 L560,533"/>

  <rect class="box" x="790" y="590" width="250" height="74"/>
  <text class="t" x="915" y="614">Dev / support laptop</text>
  <text class="s" x="915" y="634">flash-gateway.ps1; SSH and nc to TCP 9000</text>
  <text class="s" x="915" y="652">on the LAN; SSH anywhere via localproxy</text>
  <path class="line" d="M790,627 L700,627 L700,533"/>
  <path class="line" d="M1040,627 L1190,627 L1190,370 L1176,370"/>
  <text class="l" x="1186" y="580" text-anchor="end">SSH through</text>
  <text class="l" x="1186" y="594" text-anchor="end">a tunnel</text>
</svg>
