<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Pi 5 LoRaWAN gateway: hardware and connectivity</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.5; rx: 8; }
      .hw { fill: #eef4fb; }
      .sw { fill: #f3f7ee; stroke: #5a7a3a; }
      .cloud { fill: #fbf3e8; stroke: #a0672a; }
      .ext { fill: #f4f4f4; stroke: #777; stroke-dasharray: 5 4; }
      .group { fill: none; stroke: #2b5d8c; stroke-width: 1.5; stroke-dasharray: 8 5; }
      .t { font-size: 14px; fill: #111; text-anchor: middle; font-weight: 600; }
      .s { font-size: 12px; fill: #444; text-anchor: middle; }
      .l { font-size: 11.5px; fill: #333; }
      .gl { font-size: 13px; fill: #2b5d8c; font-weight: 600; }
      .line { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .rf { stroke: #8a3ab9; stroke-width: 1.8; fill: none; stroke-dasharray: 2 4; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#111">Raspberry Pi 5 LoRaWAN gateway: hardware and connectivity</text>

  <!-- Sensor node -->
  <rect class="box hw" x="30" y="250" width="170" height="80"/>
  <text class="t" x="115" y="280">LoRaWAN soil-sensor</text>
  <text class="t" x="115" y="298">node(s)</text>
  <text class="s" x="115" y="318">US915, sub-band 2</text>

  <!-- Antenna -->
  <rect class="box hw" x="260" y="120" width="170" height="60"/>
  <text class="t" x="345" y="145">915 MHz antenna</text>
  <text class="s" x="345" y="165">5.8 dBi, N to u.FL</text>

  <!-- Gateway group -->
  <rect class="group" x="240" y="200" width="530" height="300" rx="12"/>
  <text class="gl" x="252" y="492">Gateway under test</text>

  <!-- WM1302 -->
  <rect class="box hw" x="260" y="232" width="170" height="138"/>
  <text class="t" x="345" y="256">Seeed WM1302</text>
  <text class="t" x="345" y="274">on Pi HAT</text>
  <text class="s" x="345" y="298">SX1302 baseband</text>
  <text class="s" x="345" y="316">SX1250 radio</text>
  <text class="s" x="345" y="334">temperature sensor</text>
  <text class="s" x="345" y="356">40-pin header</text>

  <!-- Pi 5 -->
  <rect class="box hw" x="540" y="232" width="210" height="250"/>
  <text class="t" x="645" y="256">Raspberry Pi 5 (BCM2712)</text>
  <text class="s" x="645" y="274">Buildroot Linux image</text>
  <rect class="box sw" x="560" y="288" width="170" height="36"/>
  <text class="s" x="645" y="311">sx1302_hal (libloragw)</text>
  <rect class="box sw" x="560" y="336" width="170" height="36"/>
  <text class="s" x="645" y="359">LoRa Basics Station</text>
  <rect class="box sw" x="560" y="384" width="170" height="36"/>
  <text class="s" x="645" y="407">gwmon: supervisor, TCP 9000</text>
  <rect class="box sw" x="560" y="432" width="170" height="36"/>
  <text class="s" x="645" y="455">/dev/watchdog (fed by gwmon)</text>
  <line class="line" x1="645" y1="324" x2="645" y2="335"/>
  <line class="line" x1="645" y1="384" x2="645" y2="373"/>
  <line class="line" x1="645" y1="420" x2="645" y2="431"/>

  <!-- WM1302 <-> Pi links -->
  <line class="line" x1="430" y1="296" x2="559" y2="300"/>
  <text class="l" x="440" y="290">SPI0 (spidev)</text>
  <line class="line" x1="430" y1="326" x2="559" y2="310"/>
  <text class="l" x="440" y="338">I2C1 (temperature)</text>
  <line class="line" x1="540" y1="362" x2="431" y2="362"/>
  <text class="l" x="436" y="384">GPIO17/5 reset</text>
  <text class="l" x="436" y="398">(libgpiod)</text>

  <!-- RF and antenna -->
  <path class="rf" d="M200,270 C230,240 240,190 259,165"/>
  <text class="l" x="160" y="200" fill="#8a3ab9">LoRa RF uplinks</text>
  <line class="line" x1="345" y1="180" x2="345" y2="231"/>
  <text class="l" x="352" y="194">u.FL</text>

  <!-- Reference gateway -->
  <rect class="box ext" x="810" y="100" width="190" height="64"/>
  <text class="t" x="905" y="126">Reference commercial</text>
  <text class="s" x="905" y="146">gateway (comparison)</text>
  <path class="rf" d="M115,250 L115,80 L905,80 L905,99"/>
  <text class="l" x="440" y="74" fill="#8a3ab9">same uplinks heard by both gateways</text>

  <!-- Network and cloud -->
  <rect class="box" x="810" y="296" width="150" height="66"/>
  <text class="t" x="885" y="322">Ethernet / Wi-Fi</text>
  <text class="s" x="885" y="342">to the Internet</text>
  <line class="line" x1="730" y1="354" x2="809" y2="334"/>
  <text class="l" x="812" y="286">WebSocket over TLS</text>
  <line class="line" x1="955" y1="164" x2="940" y2="295"/>

  <rect class="box cloud" x="1000" y="290" width="175" height="78"/>
  <text class="t" x="1087" y="316">AWS IoT Core</text>
  <text class="t" x="1087" y="334">for LoRaWAN</text>
  <text class="s" x="1087" y="354">LoRaWAN network server</text>
  <line class="line" x1="960" y1="329" x2="999" y2="329"/>

  <rect class="box cloud" x="1000" y="420" width="175" height="62"/>
  <text class="t" x="1087" y="446">MQTT test client</text>
  <text class="s" x="1087" y="466">verifies uplinks arrive</text>
  <line class="line" x1="1087" y1="368" x2="1087" y2="419"/>

  <!-- Bottom: power, storage, laptop -->
  <rect class="box" x="260" y="540" width="170" height="54"/>
  <text class="t" x="345" y="563">27 W USB-C PD</text>
  <text class="s" x="345" y="582">power supply</text>
  <path class="line" d="M430,567 L600,567 L600,483"/>

  <rect class="box" x="30" y="540" width="170" height="54"/>
  <text class="t" x="115" y="563">microSD</text>
  <text class="s" x="115" y="582">Buildroot sdcard.img</text>
  <path class="line" d="M200,552 L240,552 L240,520 L560,520 L560,483"/>

  <rect class="box" x="810" y="530" width="210" height="64"/>
  <text class="t" x="915" y="556">Dev laptop (same LAN)</text>
  <text class="s" x="915" y="576">SSH; nc to TCP 9000 status</text>
  <path class="line" d="M810,562 L700,562 L700,483"/>
</svg>
