/*
 * LoRa Basics Station configuration for the Seeed WM1302 Pi HAT (SX1302 + 2x SX1250, SPI, US915)
 * on the Pi 5. Installed as /etc/station/station.conf; /etc/station is Station's home directory.
 *
 * Based on examples/corecell/lns-ttn/station.conf from Basics Station v2.0.6. The radio values
 * (rssi_offset, rssi_tcomp, tx_gain_lut) are the same as in /etc/lora_pkt_fwd/global_conf.json
 * from issue #3. There is no channel plan here: the LNS (AWS IoT Core for LoRaWAN) sends the
 * US915 channels in its router_config message when Station connects.
 *
 * No secret is in this file. The server address and the credentials are the cups.* and tc.*
 * files next to it, which S35provision installs from the boot partition.
 *
 * This file was partially generated using Claude Code using the chat session at:
 * Link to chat session (issue #4): TODO(issue-4-session-link)
 */
{
    "SX1302_conf": {
        "device": "/dev/spidev0.0",
        "lorawan_public": true,
        "clksrc": 0,                 /* radio_0 provides the clock to the concentrator */
        "full_duplex": false,
        "radio_0": {
            /* freq and enable come from the LNS. Only the hardware settings are listed here. */
            "type": "SX1250",
            "rssi_offset": -215.4,
            "rssi_tcomp": {"coeff_a": 0, "coeff_b": 0, "coeff_c": 20.41, "coeff_d": 2162.56, "coeff_e": 0},
            "tx_enable": true,
            "antenna_gain": 0,       /* dBi */
            "tx_gain_lut": [
                {"rf_power": 12, "pa_gain": 0, "pwr_idx": 15},
                {"rf_power": 13, "pa_gain": 0, "pwr_idx": 16},
                {"rf_power": 14, "pa_gain": 0, "pwr_idx": 17},
                {"rf_power": 15, "pa_gain": 0, "pwr_idx": 19},
                {"rf_power": 16, "pa_gain": 0, "pwr_idx": 20},
                {"rf_power": 17, "pa_gain": 0, "pwr_idx": 22},
                {"rf_power": 18, "pa_gain": 1, "pwr_idx": 1},
                {"rf_power": 19, "pa_gain": 1, "pwr_idx": 2},
                {"rf_power": 20, "pa_gain": 1, "pwr_idx": 3},
                {"rf_power": 21, "pa_gain": 1, "pwr_idx": 4},
                {"rf_power": 22, "pa_gain": 1, "pwr_idx": 5},
                {"rf_power": 23, "pa_gain": 1, "pwr_idx": 6},
                {"rf_power": 24, "pa_gain": 1, "pwr_idx": 7},
                {"rf_power": 25, "pa_gain": 1, "pwr_idx": 9},
                {"rf_power": 26, "pa_gain": 1, "pwr_idx": 11},
                {"rf_power": 27, "pa_gain": 1, "pwr_idx": 14}
            ]
        },
        "radio_1": {
            "type": "SX1250",
            "rssi_offset": -215.4,
            "rssi_tcomp": {"coeff_a": 0, "coeff_b": 0, "coeff_c": 20.41, "coeff_d": 2162.56, "coeff_e": 0},
            "tx_enable": false
        }
    },
    "station_conf": {
        /*
         * The gateway EUI. Station takes a file name here as well as an EUI. S60station writes
         * the SX1302's own EUI (from util_chip_id) to this file before it starts Station, so the
         * image is not tied to one board. Without "routerid", Station would make an EUI from the
         * eth0 MAC address. This is the EUI to register in AWS IoT Core for LoRaWAN.
         */
        "routerid": "/var/run/station.eui",
        /* Station runs this before each start of the radio, with the SPI device as argument. */
        "radio_init": "/usr/bin/wm1302-reset.sh",
        "RADIO_INIT_WAIT": "5s",
        "RX_POLL_INTV": "10ms",
        /* /var/log is a tmpfs, so the log costs RAM, not SD card writes: at most 3 x 2 MB. */
        "log_file": "/var/log/station.log",
        "log_level": "INFO",         /* XDEBUG,DEBUG,VERBOSE,INFO,NOTICE,WARNING,ERROR,CRITICAL */
        "log_size": 2000000,
        "log_rotate": 2
    }
}
