# chronyd configuration for the gateway. The Pi 5 has no RTC battery here, so the clock is wrong at
# every cold boot until NTP sets it, and TLS to AWS IoT Core fails until then.
#
# This file was partially generated using Claude Code using the chat session at:
# Link to chat session (issue #5): https://claude.ai/code/cshk_01CSAPnyKYshomy4KcvdEtyKAXn5vdMngjU3SW9R1aadXg

# iburst: four quick requests at start, so the first sync takes seconds instead of minutes.
pool pool.ntp.org iburst

# Step the clock when it is off by more than 1 s, during the first three updates only.
# After that the clock is only slewed.
makestep 1.0 3

# Let the kernel copy the system time to the RTC, which keeps it across a warm reboot.
rtcsync

driftfile /var/lib/chrony/drift
